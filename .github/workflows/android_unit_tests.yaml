name: Android Unit Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew -Pencryption_key="${ENCRYPTION_KEY}" :androidApp:testDebugUnitTest --rerun-tasks